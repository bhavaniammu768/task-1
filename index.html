<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Guidance Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Gradient background */
      background: linear-gradient(135deg, #667eea, #764ba2, #6dd5ed, #2193b0);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      max-width: 800px;
      width: 90%;
      padding: 30px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(6px);
    }

    h1 {
      text-align: center;
      color: #0ea5a4;
      margin-bottom: 10px;
    }
    p {
      text-align: center;
      color: #475569;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 12px;
      font-size: 14px;
      margin-top: 10px;
    }

    button {
      display: block;
      margin: 20px auto 0;
      padding: 12px 20px;
      background: linear-gradient(90deg, #0ea5a4, #028c89);
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #028c89, #0ea5a4);
      transform: scale(1.05);
    }

    .results {
      margin-top: 20px;
    }
    .card {
      padding: 16px;
      margin-bottom: 12px;
      background: #f9fafb;
      border-left: 5px solid #0ea5a4;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card h3 {
      margin: 0 0 8px;
      color: #0f172a;
    }
    .card p {
      margin: 4px 0;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌟 AI Career Guidance Tool</h1>
    <p>Enter your skills (comma-separated) and discover career paths, courses, and jobs 🚀</p>
    <textarea id="skills" placeholder="e.g. Python, Communication, Design"></textarea>
    <button onclick="suggestCareers()">Suggest Careers</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    const database = [
      {
        career: "Software Developer",
        skills: ["python", "java", "javascript", "sql"],
        courses: ["Full Stack Development", "Data Structures", "Databases"],
        jobs: ["Frontend Developer", "Backend Developer", "Mobile App Developer"]
      },
      {
        career: "Data Scientist",
        skills: ["python", "statistics", "machine learning", "sql"],
        courses: ["Machine Learning", "Data Visualization", "Big Data Analytics"],
        jobs: ["ML Engineer", "Data Analyst", "AI Specialist"]
      },
      {
        career: "UI/UX Designer",
        skills: ["figma", "design", "creativity", "communication"],
        courses: ["UI/UX Fundamentals", "Prototyping", "Human-Computer Interaction"],
        jobs: ["UI Designer", "UX Researcher", "Product Designer"]
      }
    ];

    function suggestCareers() {
      const input = document.getElementById("skills").value.toLowerCase();
      const skills = input.split(",").map(s => s.trim());
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (!input) {
        resultsDiv.innerHTML = "<p>Please enter your skills.</p>";
        return;
      }

      let matches = [];

      database.forEach(item => {
        let score = item.skills.filter(skill => skills.includes(skill)).length;
        if (score > 0) {
          matches.push(item);
        }
      });

      if (matches.length === 0) {
        resultsDiv.innerHTML = "<p>No matching careers found.</p>";
      } else {
        matches.forEach(match => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${match.career}</h3>
            <p><strong>Suggested Courses:</strong> ${match.courses.join(", ")}</p>
            <p><strong>Job Roles:</strong> ${match.jobs.join(", ")}</p>
          `;
          resultsDiv.appendChild(card);
        });
      }
    }
  </script>
</body>
</html>
